# Values for labelprinter on Proxmox k3s cluster
replicaCount: 1

image:
  repository: "190928636648.dkr.ecr.us-west-2.amazonaws.com/label-printer"
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: aws-registry

serviceAccount:
  create: false
  automount: true
  name: "default"

securityContext:
  privileged: true

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "traefik"
  hosts:
    - host: label.todobest.me
      paths:
        - path: /
          pathType: Prefix
  tls: []

nodeSelector: {}

affinity: {}

# USB printer passthrough
volumes:
- name: usb-lp0
  hostPath:
    path: /dev/usb/lp0
    type: CharDevice

volumeMounts:
- name: usb-lp0
  mountPath: /dev/usb/lp0
