apiVersion: batch/v1
kind: CronJob
metadata:
  name: aws-secrets-sync-cron
  namespace: default
spec:
  schedule: "*/5 * * * *"  # Every 5 minutes
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          serviceAccountName: secrets-sync-sa
          restartPolicy: Never
          # Run on AWS instances with instance profile
          nodeSelector:
            instance: internal
          dnsPolicy: "ClusterFirst"
          dnsConfig:
            nameservers:
              - "8.8.8.8"
              - "169.254.169.253"
          containers:
          - name: secrets-sync
            imagePullPolicy: Always
            image: public.ecr.aws/i9m8a4n0/aws-kubectl:latest
            env:
            - name: AWS_REGION
              value: "us-west-2"
            - name: SECRET_NAME
              value: "cloudflare-tunnel-token"
            - name: TARGET_NAMESPACE
              value: "cloudflare-tunnel"
            - name: K8S_SECRET_NAME
              value: "cloudflare-tunnel-token"
            command:
            - "/bin/sh"
            - "-c"
            - |
              echo "Syncing AWS Secret: $SECRET_NAME to namespace: $TARGET_NAMESPACE"
              
              # Get secret from AWS Secrets Manager
              TOKEN=$(aws secretsmanager get-secret-value \
                --secret-id $SECRET_NAME \
                --query SecretString \
                --output text 2>/dev/null)
              
              if [ -z "$TOKEN" ] || [ "$TOKEN" = "placeholder" ]; then
                echo "ERROR: Secret $SECRET_NAME is empty or not set"
                exit 1
              fi
              
              # Create namespace if it doesn't exist
              kubectl create namespace $TARGET_NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
              
              # Delete existing secret if it exists
              kubectl delete secret $K8S_SECRET_NAME -n $TARGET_NAMESPACE 2>/dev/null || true
              
              # Create new secret
              kubectl create secret generic $K8S_SECRET_NAME \
                -n $TARGET_NAMESPACE \
                --from-literal=token="$TOKEN"
              
              echo "Successfully synced secret $K8S_SECRET_NAME to namespace $TARGET_NAMESPACE"
              
              # Verify secret was created
              kubectl get secret $K8S_SECRET_NAME -n $TARGET_NAMESPACE
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-sync-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secrets-sync-cluster-role
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create", "delete", "get", "list"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["create", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secrets-sync-cluster-rolebinding
subjects:
- kind: ServiceAccount
  name: secrets-sync-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: secrets-sync-cluster-role
  apiGroup: rbac.authorization.k8s.io
