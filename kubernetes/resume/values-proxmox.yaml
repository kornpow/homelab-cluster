# Resume app values for Proxmox k3s cluster
replicaCount: 1

image:
  repository: nginx
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []

serviceAccount:
  create: false
  name: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false  # Cloudflare tunnel handles ingress

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

volumes:
- name: html-volume
  configMap:
    name: nginx-html

volumeMounts:
- name: html-volume
  mountPath: /usr/share/nginx/html

nodeSelector: {}

affinity: {}
